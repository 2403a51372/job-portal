<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saved Jobs | CareerBridge</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
  <script defer src="js/utils.js"></script>
  <script defer src="js/auth.js"></script>
  <script defer src="js/jobs.js"></script>
  <script defer src="js/app.js"></script>
</head>
<body>
  <div id="appNavbar"></div>

  <div class="workspace-shell">
    <aside class="workspace-sidebar" id="workspaceSidebar"></aside>

    <main class="workspace-main">
      <div class="workspace-topbar">
        <div>
          <h1 style="font-size:1.65rem; font-weight:700;">Saved Jobs</h1>
          <p class="text-secondary" id="savedJobsCount">Loading your shortlisted roles...</p>
        </div>
        <div class="flex gap-2" style="align-items:center;">
          <label for="savedJobsSort" class="text-muted" style="font-size:0.86rem;">Sort by:</label>
          <select id="savedJobsSort" class="form-control" style="width:auto;">
            <option value="recent">Recently Saved</option>
            <option value="salary_desc">Highest Salary</option>
            <option value="title_asc">Job Title (A-Z)</option>
          </select>
        </div>
      </div>

      <div class="grid-2" id="savedJobsGrid"></div>
    </main>
  </div>
</body>
</html>
