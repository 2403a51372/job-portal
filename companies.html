<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Companies | CareerBridge</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/responsive.css">
  <script defer src="js/utils.js"></script>
  <script defer src="js/auth.js"></script>
  <script defer src="js/jobs.js"></script>
  <script defer src="js/app.js"></script>
</head>
<body>
  <div id="appNavbar"></div>

  <section class="page-banner">
    <div class="container">
      <div class="breadcrumb"><a href="index.html">Home</a> <i class="bi bi-chevron-right"></i> <span>Companies</span></div>
      <h1>Top Hiring Companies</h1>
      <p>Discover 15 vetted employers, explore their culture and benefits, and see open roles.</p>
    </div>
  </section>

  <main class="section-sm">
    <div class="container">
      <div class="search-bar-inline" style="grid-template-columns: 1.5fr 1fr;">
        <div class="input-wrap">
          <i class="bi bi-search input-icon"></i>
          <input type="text" id="companySearchInput" class="form-control" placeholder="Search company name, city, or description...">
        </div>
        <select id="companyIndustrySelect" class="form-control" aria-label="Filter by industry">
          <option value="">All Industries</option>
        </select>
      </div>

      <div class="grid-3" id="companiesGrid"></div>
    </div>
  </main>

  <div id="appFooter"></div>
</body>
</html>
