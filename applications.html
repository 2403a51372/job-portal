<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Applications | CareerBridge</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
  <script defer src="js/utils.js"></script>
  <script defer src="js/auth.js"></script>
  <script defer src="js/jobs.js"></script>
  <script defer src="js/app.js"></script>
</head>
<body>
  <div id="appNavbar"></div>

  <div class="workspace-shell">
    <aside class="workspace-sidebar" id="workspaceSidebar"></aside>

    <main class="workspace-main">
      <div class="workspace-topbar">
        <div>
          <h1 style="font-size:1.65rem; font-weight:700;">Applications Tracker</h1>
          <p class="text-secondary">Monitor interview stages, view cover notes, or withdraw applications.</p>
        </div>
        <a href="jobs.html" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Apply to More Jobs</a>
      </div>

      <div class="search-bar-inline" style="grid-template-columns: 1.5fr 1fr;">
        <div class="input-wrap">
          <i class="bi bi-search input-icon"></i>
          <input type="text" id="appsSearchInput" class="form-control" placeholder="Search by job title or company...">
        </div>
        <select id="appsStatusFilter" class="form-control" aria-label="Filter by status">
          <option value="All">All Statuses</option>
          <option value="Applied">Applied</option>
          <option value="Interview">Interview</option>
          <option value="Accepted">Accepted</option>
          <option value="Rejected">Rejected</option>
          <option value="Withdrawn">Withdrawn</option>
        </select>
      </div>

      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th>Role</th>
              <th>Company</th>
              <th>Salary</th>
              <th>Applied</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="applicationsTableBody"></tbody>
        </table>
      </div>
    </main>
  </div>
</body>
</html>
