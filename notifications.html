<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications | CareerBridge</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
  <script defer src="js/utils.js"></script>
  <script defer src="js/auth.js"></script>
  <script defer src="js/notification.js"></script>
  <script defer src="js/app.js"></script>
</head>
<body>
  <div id="appNavbar"></div>

  <div class="workspace-shell">
    <aside class="workspace-sidebar" id="workspaceSidebar"></aside>

    <main class="workspace-main">
      <div class="workspace-topbar">
        <div>
          <h1 style="font-size:1.65rem; font-weight:700;">Notifications Center</h1>
          <p class="text-secondary">Stay updated on job alerts, interview invites, and recruiter messages.</p>
        </div>
        <div class="flex flex-wrap gap-1">
          <button type="button" class="btn btn-secondary btn-sm" id="markAllReadBtn"><i class="bi bi-check2-all"></i> Mark All Read</button>
          <button type="button" class="btn btn-ghost btn-sm text-danger" id="clearAllNotifsBtn"><i class="bi bi-trash"></i> Clear All</button>
        </div>
      </div>

      <div class="flex flex-wrap gap-1 mb-3">
        <button type="button" class="btn btn-primary btn-sm" data-notif-tab="all">All</button>
        <button type="button" class="btn btn-secondary btn-sm" data-notif-tab="unread">Unread</button>
        <button type="button" class="btn btn-secondary btn-sm" data-notif-tab="job_alert">Job Alerts</button>
        <button type="button" class="btn btn-secondary btn-sm" data-notif-tab="interview">Interview Alerts</button>
        <button type="button" class="btn btn-secondary btn-sm" data-notif-tab="message">Messages</button>
      </div>

      <div class="flex" style="flex-direction:column; gap:12px;" id="notificationsList"></div>
    </main>
  </div>
</body>
</html>
