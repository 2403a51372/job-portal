<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse Jobs | CareerBridge</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/responsive.css">
  <script defer src="js/utils.js"></script>
  <script defer src="js/auth.js"></script>
  <script defer src="js/jobs.js"></script>
  <script defer src="js/app.js"></script>
</head>
<body>
  <div id="appNavbar"></div>

  <section class="page-banner">
    <div class="container">
      <div class="breadcrumb"><a href="index.html">Home</a> <i class="bi bi-chevron-right"></i> <span>Jobs</span></div>
      <h1>Explore Open Opportunities</h1>
      <p>Filter 30+ verified roles by location, salary range, skills, experience level, and remote availability.</p>
    </div>
  </section>

  <main class="section-sm">
    <div class="container">
      <!-- Top Search Bar -->
      <form class="search-bar-inline" id="jobsSearchForm" role="search">
        <div class="input-wrap">
          <i class="bi bi-search input-icon"></i>
          <input type="text" id="jobsSearchInput" class="form-control" placeholder="Search job title, skill (e.g. Python, Figma), or company...">
        </div>
        <div class="input-wrap">
          <i class="bi bi-geo-alt input-icon"></i>
          <input type="text" id="jobsLocationInput" class="form-control" placeholder="Location (e.g. San Francisco, London)">
        </div>
        <button type="submit" class="btn btn-primary">Find Jobs</button>
      </form>

      <div class="jobs-layout">
        <!-- Filter Sidebar -->
        <aside class="filter-sidebar" aria-label="Job filters">
          <div class="flex-between mb-2">
            <h2 style="font-size:1.08rem; font-weight:700;"><i class="bi bi-sliders text-primary"></i> Filters</h2>
            <button type="button" id="clearFiltersBtn" class="text-primary" style="font-size:0.84rem; font-weight:600;">Reset All</button>
          </div>

          <div class="filter-group">
            <div class="filter-group-title">Category</div>
            <select id="filterCategorySelect" class="form-control" aria-label="Filter by category">
              <option value="">All Categories</option>
            </select>
          </div>

          <div class="filter-group">
            <div class="filter-group-title">
              <span>Minimum Salary</span>
              <span id="filterSalaryDisplay" class="text-primary">$0k+</span>
            </div>
            <input type="range" id="filterSalaryRange" min="0" max="180000" step="10000" value="0" style="width:100%; accent-color:var(--primary);" aria-label="Minimum salary">
          </div>

          <div class="filter-group">
            <div class="filter-group-title">Work Mode</div>
            <label class="checkbox-label">
              <input type="checkbox" id="filterRemoteOnly">
              <span>Remote Jobs Only</span>
            </label>
          </div>

          <div class="filter-group">
            <div class="filter-group-title">Skills Filter</div>
            <input type="text" id="filterSkillsInput" class="form-control" placeholder="e.g. JavaScript, AWS, SQL">
          </div>

          <div class="filter-group">
            <div class="filter-group-title">Job Type</div>
            <div class="filter-options">
              <label class="checkbox-label"><input type="checkbox" name="jobType" value="Full-Time"> Full-Time</label>
              <label class="checkbox-label"><input type="checkbox" name="jobType" value="Part-Time"> Part-Time</label>
              <label class="checkbox-label"><input type="checkbox" name="jobType" value="Contract"> Contract</label>
              <label class="checkbox-label"><input type="checkbox" name="jobType" value="Internship"> Internship</label>
            </div>
          </div>

          <div class="filter-group">
            <div class="filter-group-title">Experience Level</div>
            <div class="filter-options">
              <label class="checkbox-label"><input type="checkbox" name="expLevel" value="Entry Level (0-2 yrs)"> Entry Level (0-2 yrs)</label>
              <label class="checkbox-label"><input type="checkbox" name="expLevel" value="Mid-Level (2-5 yrs)"> Mid-Level (2-5 yrs)</label>
              <label class="checkbox-label"><input type="checkbox" name="expLevel" value="Senior (5+ yrs)"> Senior (5+ yrs)</label>
              <label class="checkbox-label"><input type="checkbox" name="expLevel" value="Lead / Principal"> Lead / Principal</label>
            </div>
          </div>
        </aside>

        <!-- Results Area -->
        <div>
          <div class="jobs-toolbar">
            <span id="jobsResultCount" style="font-weight:600; font-size:0.94rem;">Loading jobs...</span>
            <div class="flex gap-1" style="align-items:center;">
              <label for="jobsSortSelect" class="text-muted" style="font-size:0.86rem;">Sort by:</label>
              <select id="jobsSortSelect" class="form-control" style="width:auto; padding:7px 12px;">
                <option value="newest">Newest First</option>
                <option value="salary_desc">Salary: High to Low</option>
                <option value="salary_asc">Salary: Low to High</option>
              </select>
            </div>
          </div>

          <div class="grid-2" id="jobsResultsGrid"></div>
          <nav class="pagination" id="jobsPagination" aria-label="Jobs pagination"></nav>
        </div>
      </div>
    </div>
  </main>

  <div id="appFooter"></div>
</body>
</html>
